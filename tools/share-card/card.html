<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ink:#0a0a0b; --paper:#f3f0ea; --paper-mute:#a9a49b; --ember:#e2542c;
  }
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;background:var(--ink)}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;background:var(--ink)}

  /* The frame itself, cropped to the part of the poster that carries the
     horizon, and pulled down so the type sits on the dark half. */
  .card__img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:50% 34%;
    filter:saturate(.92) contrast(1.04) brightness(.94);
  }
  /* Two scrims: one from the bottom for the block of type, one from the
     left so the name never lands on the bright water. */
  .card__scrim{position:absolute;inset:0;
    background:
      linear-gradient(to top, rgba(10,10,11,.92) 0%, rgba(10,10,11,.74) 30%, rgba(10,10,11,.26) 56%, rgba(10,10,11,0) 80%),
      linear-gradient(to right, rgba(10,10,11,.50) 0%, rgba(10,10,11,.12) 42%, rgba(10,10,11,0) 72%);
  }
  /* Projection bars, the same handoff the hero makes on scroll. */
  .bar{position:absolute;left:0;right:0;height:26px;background:var(--ink)}
  .bar--t{top:0} .bar--b{bottom:0}

  .body{
    position:absolute;left:72px;right:72px;bottom:84px;
    font-family:"Archivo","Helvetica Neue",Arial,sans-serif;color:var(--paper);
  }
  .eyebrow{
    display:flex;align-items:center;gap:14px;
    font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;
    font-size:15px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;
    color:var(--paper);margin-bottom:26px;
  }
  .eyebrow i{display:block;width:46px;height:2px;background:var(--ember);flex:none}
  .name{
    font-size:132px;line-height:.84;font-weight:800;letter-spacing:-.05em;
    text-transform:uppercase;
  }
  .lede{
    margin-top:26px;
    font-family:"Instrument Serif",Georgia,serif;font-style:italic;
    font-size:31px;line-height:1.3;letter-spacing:0;
    color:rgba(243,240,234,.94);max-width:none;white-space:nowrap;
  }

  .foot{
    position:absolute;left:72px;right:72px;bottom:44px;
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;
    font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-mute);
  }
</style></head>
<body>
<div class="card">
  <img class="card__img" src="../../site/assets/video/hero-poster.jpg" alt="">
  <div class="card__scrim"></div>
  <div class="bar bar--t"></div>
  <div class="bar bar--b"></div>

  <div class="body">
    <div class="eyebrow"><i></i>Photography &amp; Film</div>
    <div class="name">Rafa Diniz</div>
    <div class="lede">Documentary and brand film,<br>architecture, wildlife, landscape and sport.</div>
  </div>

  <div class="foot">
    <span>byrafadiniz.com</span>
    <span>Gainesville, Florida</span>
  </div>
</div>
</body></html>
